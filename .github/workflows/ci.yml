name: Validate & Security Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifests, links, and formatting
        run: node scripts/validate.mjs
      - name: Run skill security audit
        run: node scripts/security-audit.mjs
      - name: Check install script syntax
        run: bash -n scripts/install.sh
